# ===== THÊM vào site parking.lordmc.net đang chạy, KHÔNG cần đổi chỗ để index.html =====

# (1) Đặt NGOÀI khối server { }, ở cấp http (đầu file conf):
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# (2) Đặt TRONG khối server { } của parking.lordmc.net:
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_read_timeout 3600s;
}
location = /device {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_read_timeout 3600s;
}
# Sau đó:  sudo nginx -t && sudo systemctl reload nginx
